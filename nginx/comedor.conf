# Nginx — Sistema de Tickets Comedor
# Instalar: sudo ln -s /home/john/comedor/Tickets_Comedor/nginx/comedor.conf /etc/nginx/sites-enabled/comedor
# Verificar:  sudo nginx -t
# Aplicar:    sudo systemctl reload nginx

server {
    listen 5001;
    server_name _;

    # Logs
    access_log /var/log/nginx/comedor-access.log;
    error_log  /var/log/nginx/comedor-error.log;

    # ── API REST ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Socket.IO (WebSocket + HTTP long-polling) ─────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_http_version 1.1;

        # Cabeceras para WebSocket — Connection usa el map $connection_upgrade
        # (upgrade solo cuando el cliente realmente envía Upgrade, keep-alive en polling)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Sin buffer: crítico para long-polling de Socket.IO
        # Con buffering activo Nginx acumula la respuesta y Socket.IO no la recibe
        proxy_buffering    off;

        # Tiempo extendido para conexiones WebSocket persistentes
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Frontend React (archivos estáticos del build) ─────────
    root  /home/john/comedor/Tickets_Comedor/frontend/dist;
    index index.html;

    # index.html SIEMPRE revalida: es el que referencia los assets con
    # hash de Vite. Sin esto el navegador cachea un index.html viejo y
    # sigue cargando JS/CSS antiguos aunque se haya hecho un nuevo build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        # SPA fallback: cualquier ruta no encontrada devuelve index.html
        # para que React Router maneje la navegación en el cliente
        try_files $uri $uri/ /index.html;

        # Cache para assets con hash en el nombre (Vite los genera así)
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
