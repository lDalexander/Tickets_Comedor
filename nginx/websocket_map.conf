# Mapa para cabecera Connection en proxies WebSocket
# Incluir en el bloque http{} de nginx.conf:
#   include /home/john/comedor/Tickets_Comedor/nginx/websocket_map.conf;
# O copiar a /etc/nginx/conf.d/websocket_map.conf

map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        keep-alive;
}
